<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Локальный запуск моей ONNX модели</title>
    
    <!-- Подключаем ОФИЦИАЛЬНЫЙ и полный движок ONNX Runtime Web напрямую со стабильного сервера -->
    <script src="https://jsdelivr.net"></script>
    
    <script type="module">
        let session;
        
        // ВНИМАНИЕ: Укажите ваши 3 класса строго в том алфавитном порядке, 
        // в каком они обучались в Python (свойство dls.vocab вашей модели).
        // Например: ["dombra", "violin", "yurta"]
        const LABELS = ["dombra", "violin", "yurta"]; 

        async function init() {
            try {
                document.getElementById('status').innerText = "Загрузка вашей ONNX модели...";
                
                // Принудительно заставляем движок работать в режиме WASM на процессоре браузера
                // Это гарантирует стабильность и обходит любые ошибки видеокарт
                session = await ort.InferenceSession.create('./onnx_test_model.onnx', { executionProviders: ['wasm'] });
                
                document.getElementById('status').innerText = "Модель успешно загружена! Выберите картинку.";
            } catch (e) {
                document.getElementById('status').innerText = "Ошибка загрузки модели: " + e.message;
            }
        }

        // Преобразование картинки в формат тензора (ImageNet нормализация fastai)
        function imageToTensor(imgElement) {
            const canvas = document.createElement('canvas');
            canvas.width = 224;
            canvas.height = 224;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgElement, 0, 0, 224, 224);
            const imgData = ctx.getImageData(0, 0, 224, 224).data;

            const float32Array = new Float32Array(1 * 3 * 224 * 224);
            const mean = [0.485, 0.456, 0.406];
            const std = [0.229, 0.224, 0.225];

            for (let i = 0; i < 224 * 224; i++) {
                let r = imgData[i * 4] / 255;
                let g = imgData[i * 4 + 1] / 255;
                let b = imgData[i * 4 + 2] / 255;

                float32Array[i] = (r - mean[0]) / std[0];
                float32Array[i + 224 * 224] = (g - mean[1]) / std[1];
                float32Array[i + 2 * 224 * 224] = (b - mean[2]) / std[2];
            }
            return new ort.Tensor('float32', float32Array, [1, 3, 224, 224]);
        }

        async function process(event) {
            const file = event.target.files[0];
            if (!file) return;

            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';

            img.onload = async () => {
                document.getElementById('status').innerText = "Нейросеть вычисляет пиксели...";
                document.getElementById('result').innerText = "";
                
                try {
                    const inputTensor = imageToTensor(img);
                    
                    // Динамически считываем имя входного слоя вашей модели fastai (обычно 'input' или 'images')
                    const inputName = session.inputNames[0];
                    const feeds = { [inputName]: inputTensor };
                    
                    // Запуск НАСТОЯЩИХ вычислений на ваших весах
                    const results = await session.run(feeds);
                    
                    // Динамически считываем имя выходного слоя
                    const outputName = session.outputNames[0];
                    const output = results[outputName].data; 

                    // Алгоритм Argmax: ищем класс с максимальной вероятностью из всех доступных
                    let maxIdx = 0;
                    let maxVal = output[0];
                    for(let i = 1; i < output.length; i++) {
                        if(output[i] > maxVal) { 
                            maxVal = output[i]; 
                            maxIdx = i; 
                        }
                    }

                    document.getElementById('status').innerText = "Анализ завершен!";
                    document.getElementById('result').innerText = `Результат: ${LABELS[maxIdx] || "Неизвестный класс"}`;
                } catch (err) {
                    document.getElementById('status').innerText = "Ошибка вычислений: " + err.message;
                }
            };
        }

        window.addEventListener('DOMContentLoaded', () => {
            init();
            document.getElementById('file-input').addEventListener('change', process);
        });
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f2f5; }
        .box { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; }
        #preview { max-width: 100%; display: none; margin: 20px auto; border-radius: 4px; }
        #status { color: #666; font-style: italic; margin: 15px; }
        #result { font-size: 24px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Моя собственная модель в браузере</h2>
        <div id="status">Инициализация...</div>
        <input type="file" id="file-input" accept="image/*"><br>
        <img id="preview">
        <div id="result"></div>
    </div>
</body>
</html>
