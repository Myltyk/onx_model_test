<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запуск Fast.ai модели через API</title>
    
    <script type="module">
        // Импортируем официальный легкий клиент, одобренный GitHub Pages
        import { client } from "https://jsdelivr.net";

        // ⚠️ ВНИМАНИЕ: Вставьте вашу живую ссылку из Google Colab вместо примера ниже!
        // Обязательно сохраните косую черту "/" в конце ссылки.
        const COLAB_API_URL = "https://1689b116e80a29f98f.gradio.live"; 

        async function process(event) {
            const file = event.target.files[0]; // Берем первый выбранный файл
            if (!file) return;

            // Показываем превью картинки на сайте
            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';

            document.getElementById('status').innerText = "Модель в Colab обрабатывает изображение...";
            document.getElementById('result').innerText = "";

            try {
                // Подключаемся по API к вашему запущенному Google Colab
                const app = await client(COLAB_API_URL);
                
                // Отправляем картинку в функцию предсказания (в Gradio это стандартный эндпоинт /predict)
                const result = await app.predict("/predict", [ file ]);
                
                // Считываем словарь вероятностей, который вернул Python
                const confidences = result.data[0];
                
                // Алгоритм поиска самого вероятного класса
                let highestClass = "";
                let highestProb = -1;
                
                for (const [className, probValue] of Object.entries(confidences)) {
                    if (probValue > highestProb) {
                        highestProb = probValue;
                        highestClass = className;
                    }
                }

                document.getElementById('status').innerText = "Анализ завершен!";
                document.getElementById('result').innerText = `Результат: ${highestClass} (${(highestProb * 100).toFixed(1)}%)`;
            } catch (err) {
                console.error(err);
                document.getElementById('status').innerText = "Ошибка связи с сервером Colab. Проверьте, запущена ли ячейка.";
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('file-input').addEventListener('change', process);
        });
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f2f5; }
        .box { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; box-sizing: border-box; }
        #preview { max-width: 100%; display: none; margin: 20px auto; border-radius: 4px; }
        #status { color: #666; font-style: italic; margin: 15px; }
        #result { font-size: 24px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Инференс Fast.ai модели (Лекция 2)</h2>
        <div id="status">Ожидание загрузки файла...</div>
        <input type="file" id="file-input" accept="image/*"><br>
        <img id="preview">
        <div id="result"></div>
    </div>
</body>
</html>
