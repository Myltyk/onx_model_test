<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный запуск моей модели</title>
    
    <script type="module">
        // Используем современный, легкий движок от Hugging Face, работающий без фоновых файлов
        import { AutoModel, RawImage } from 'https://jsdelivr.net';

        let model;
        // Замените на ваши три класса в алфавитном порядке из Python (dls.vocab)
        const LABELS = ["dombra", "violin", "yurta"]; 

        async function init() {
            try {
                document.getElementById('status').innerText = "Загрузка весов модели в браузер...";
                
                // Загружаем вашу локальную модель из корня этого же репозитория GitHub
                // Конфигурация указывает движку запустить архитектуру классификации ResNet
                model = await AutoModel.from_pretrained('./', { config: { model_type: 'resnet' } });
                
                document.getElementById('status').innerText = "Модель успешно загружена! Выберите картинку.";
            } catch (e) {
                document.getElementById('status').innerText = "Ошибка загрузки: " + e.message;
            }
        }

        async function process(event) {
            const file = event.target.files[0];
            if (!file) return;

            const imgUrl = URL.createObjectURL(file);
            const img = document.getElementById('preview');
            img.src = imgUrl;
            img.style.display = 'block';

            document.getElementById('status').innerText = "Нейросеть вычисляет пиксели...";
            document.getElementById('result').innerText = "";

            try {
                // Читаем загруженную картинку
                const rawImage = await RawImage.fromURL(imgUrl);
                
                // Подготавливаем пиксели (библиотека сама приведёт к 224x224 и нормализует ImageNet)
                const inputs = { pixel_values: await rawImage.toTensor() };
                
                // Запускаем инференс прямо на процессоре вашего компьютера
                const { logits } = await model(inputs);
                const output = logits.data; // Получаем массив предсказаний для всех классов

                // Алгоритм Argmax: ищем индекс самого максимального значения
                let maxIdx = 0;
                let maxVal = output[0];
                for(let i = 1; i < output.length; i++) {
                    if(output[i] > maxVal) { 
                        maxVal = output[i]; 
                        maxIdx = i; 
                    }
                }

                document.getElementById('status').innerText = "Анализ завершен!";
                document.getElementById('result').innerText = `Результат: ${LABELS[maxIdx] || "Распознано"}`;
            } catch (err) {
                document.getElementById('status').innerText = "Ошибка вычислений: " + err.message;
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            init();
            document.getElementById('file-input').addEventListener('change', process);
        });
    </script>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; background: #f0f2f5; }
        .box { background: white; padding: 30px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 500px; width: 100%; box-sizing: border-box; }
        #preview { max-width: 100%; display: none; margin: 20px auto; border-radius: 4px; }
        #status { color: #666; font-style: italic; margin: 15px; }
        #result { font-size: 24px; color: #007bff; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h2>Моя собственная модель в браузере</h2>
        <div id="status">Инициализация...</div>
        <input type="file" id="file-input" accept="image/*"><br>
        <img id="preview">
        <div id="result"></div>
    </div>
</body>
</html>
